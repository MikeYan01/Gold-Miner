<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="/src/styles.css" />
    <title>Seeded gameplay fixture</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module">
      import { createElement } from 'react';
      import { createRoot } from 'react-dom/client';
      import App from '/src/App.tsx';
      import { GameEngine } from '/src/game/engine.ts';
      import { createRandom } from '/src/game/random.ts';

      const seed = Number(new URL(location.href).searchParams.get('seed') ?? 523_260_012);
      if (!Number.isSafeInteger(seed)) throw new Error('Invalid fixture seed.');
      const random = createRandom(seed);
      const draftRandom = createRandom(2);
      // Keep seeded mines and prices independent of the size of the ability pool.
      const engine = new GameEngine(() => engine.state.draftLevel === null ? random() : draftRandom());
      window.getMiningState = () => structuredClone(engine.state);
      createRoot(document.getElementById('root')).render(createElement(App, { engine }));
    </script>
  </body>
</html>
